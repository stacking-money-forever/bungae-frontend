name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The product's calendar and time-wheel copy is specified in Korea Standard
# Time. Pin CI to the same timezone so date-boundary assertions are stable on
# GitHub-hosted runners (which default to UTC).
env:
  TZ: Asia/Seoul

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BUNGAE_API_ORIGIN: http://127.0.0.1:18091
      - run: npm run test:api-proxy
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
